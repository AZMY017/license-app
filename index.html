<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>License Key Lock & Money Management</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  
  <!-- Config File -->
  <script src="firebase-config.js"></script>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 0;
    }
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 90%;
      max-width: 350px;
    }
    h2 { margin-bottom: 20px; color: #333; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background-color: #0056b3; }
    #msg { margin-top: 15px; font-weight: bold; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>

<!-- লাইসেন্স আনলক স্ক্রিন -->
<div class="auth-container" id="lock-screen">
  <div class="card">
    <h2>সফটওয়্যার লাইসেন্স আনলক</h2>
    <input type="text" id="license-input" placeholder="এখানে লাইসেন্স কী দিন">
    <button onclick="verifyLicense()">আনলক করুন</button>
    <p id="msg"></p>
  </div>
</div>

<!-- মূল ট্রেডিং ও মানি ম্যানেজমেন্ট অ্যাপ (আনলক হওয়ার পর দেখাবে) -->
<div id="app-screen" style="display: none; padding: 20px;">
  <div class="container">
    <header>
      <h1>Masaniello Money Management</h1>
      <p class="subtitle">আপনার ট্রেডিং এর ঝুঁকি নিয়ন্ত্রণ করুন দক্ষতার সাথে</p>
    </header>

    <!-- নেভিগেশন ট্যাব -->
    <div class="tabs">
      <button class="tab-btn active" data-type="classic">Classic Masaniello</button>
      <button class="tab-btn" data-type="double">Double Chance</button>
      <button class="tab-btn" data-type="triple">Triple Chance</button>
    </div>

    <!-- ইনপুট ফরম -->
    <div class="card setup-card">
      <h3>সেশন সেটআপ</h3>
      <form id="setup-form">
        <div class="form-group">
          <label for="bankroll">শুরু করার ক্যাপিটাল ($ / ৳):</label>
          <input type="number" id="bankroll" value="1000" step="any" required>
        </div>
        <div class="form-group">
          <label for="events">মোট ট্রেড সংখ্যা (N):</label>
          <input type="number" id="events" value="10" required>
        </div>
        <div class="form-group">
          <label for="expectedWins">ন্যূনতম জয়ের লক্ষ্য (K):</label>
          <input type="number" id="expectedWins" value="6" required>
        </div>
        <div class="form-group">
          <label for="odds1">অডস/পে-আউট (Odds 1):</label>
          <input type="number" id="odds1" value="1.85" step="0.01" required>
        </div>
        <div class="form-group extra-odds" id="odds2-group" style="display:none;">
          <label for="odds2">অডস (Odds 2):</label>
          <input type="number" id="odds2" value="1.85" step="0.01">
        </div>
        <div class="form-group extra-odds" id="odds3-group" style="display:none;">
          <label for="odds3">অডস (Odds 3):</label>
          <input type="number" id="odds3" value="1.85" step="0.01">
        </div>
        <button type="submit" class="btn primary">সেশন শুরু করুন</button>
      </form>
    </div>

    <!-- সেশন ড্যাশবোর্ড -->
    <div id="session-dashboard" style="display: none;">
      <div class="card status-card">
        <div class="status-grid">
          <div><span>বর্তমান ক্যাপিটাল:</span> <strong id="current-bankroll">$0</strong></div>
          <div><span>বাকি জয় দরকার:</span> <strong id="wins-needed">0</strong></div>
          <div><span>বাকি ট্রেড:</span> <strong id="trades-left">0</strong></div>
        </div>
      </div>

      <div class="card stake-card">
        <h2>পরবর্তী ট্রেডের স্টেক (Stake):</h2>
        <div class="stake-amount" id="next-stake">$0</div>
        <div class="action-buttons">
          <button id="btn-win" class="btn success-btn">✅ জিতেছি (WIN)</button>
          <button id="btn-loss" class="btn danger-btn">❌ হেরেছি (LOSS)</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>

<script>
  // ইউনিক ডিভাইস আইডি তৈরি
  function getDeviceId() {
    let deviceId = localStorage.getItem("device_id");
    if (!deviceId) {
      deviceId = "DEV-" + Math.random().toString(36).substring(2, 9).toUpperCase();
      localStorage.setItem("device_id", deviceId);
    }
    return deviceId;
  }

  // অটো-লগইন চেক
  window.onload = function() {
    const savedKey = localStorage.getItem("active_license");
    if (savedKey) {
      document.getElementById("lock-screen").style.display = "none";
      document.getElementById("app-screen").style.display = "block";
    }
  };

  // লাইসেন্স ভ্যালিডেশন
  async function verifyLicense() {
    const key = document.getElementById("license-input").value.trim();
    const msg = document.getElementById("msg");
    const currentDeviceId = getDeviceId();

    if (!key) {
      msg.className = "error";
      msg.innerText = "অনুগ্রহ করে লাইসেন্স কী টাইপ করুন!";
      return;
    }

    msg.className = "";
    msg.innerText = "যাচাই করা হচ্ছে...";

    try {
      const docRef = db.collection("licenses").doc(key);
      const doc = await docRef.get();

      if (!doc.exists) {
        msg.className = "error";
        msg.innerText = "ভুল লাইসেন্স কী!";
        return;
      }

      const data = doc.data();

      if (data.status === "unused") {
        await docRef.update({
          status: "used",
          device_id: currentDeviceId
        });
        localStorage.setItem("active_license", key);
        msg.className = "success";
        msg.innerText = "লাইসেন্স সফলভাবে অ্যাক্টিভ হয়েছে!";
        setTimeout(() => {
          document.getElementById("lock-screen").style.display = "none";
          document.getElementById("app-screen").style.display = "block";
        }, 1000);
      } 
      else if (data.status === "used" && data.device_id === currentDeviceId) {
        localStorage.setItem("active_license", key);
        document.getElementById("lock-screen").style.display = "none";
        document.getElementById("app-screen").style.display = "block";
      } 
      else {
        msg.className = "error";
        msg.innerText = "এই লাইসেন্স কী-টি অন্য ডিভাইসে ব্যবহৃত হচ্ছে!";
      }

    } catch (err) {
      console.error(err);
      msg.className = "error";
      msg.innerText = "ত্রুটি ঘটেছে! ইন্টারনেট চেক করুন বা সিকিউরিটি রুলস যাচাই করুন।";
    }
  }
</script>

</body>
</html>
