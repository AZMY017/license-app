<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masaniello Money Management</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">

  <!-- ================= LOCK SCREEN ================= -->
  <div id="lock-screen" class="lock-screen">
    <h1>🔒 লাইসেন্স যাচাই হচ্ছে...</h1>
    <p class="subtitle">অনুগ্রহ করে অপেক্ষা করুন</p>
  </div>

  <div id="key-entry" class="card hidden">
    <h1>🔑 লাইসেন্স কী দিন</h1>
    <p class="subtitle">এই অ্যাপটি ব্যবহার করতে আপনার লাইসেন্স কী প্রয়োজন</p>
    <label>লাইসেন্স কী</label>
    <input type="text" id="key-input" placeholder="যেমনঃ ABCD-1234-EFGH" />
    <button class="btn-primary" onclick="handleActivate()">অ্যাক্টিভেট করুন</button>
    <div id="key-msg"></div>
  </div>

  <!-- ================= MAIN APP ================= -->
  <div id="main-app" class="hidden">
    <h1>📊 Masaniello Money Management</h1>
    <p class="subtitle">আপনার পছন্দের সিস্টেম বেছে নিন</p>

    <div class="tabs">
      <div class="tab-btn active" id="tab-classic" onclick="switchMode('classic')">Classic</div>
      <div class="tab-btn" id="tab-double" onclick="switchMode('double')">Double Chance</div>
      <div class="tab-btn" id="tab-triple" onclick="switchMode('triple')">Triple Chance</div>
    </div>

    <div id="panels-container"></div>

    <button class="btn-secondary" onclick="logoutDevice()">এই ডিভাইস থেকে লগআউট</button>
    <footer>Licensed software — unauthorized sharing is prohibited</footer>
  </div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="license.js"></script>
<script src="app.js"></script>

<script>
// প্রতিটা মোডের প্যানেল JS দিয়ে তৈরি। Classic-এ Target% ফিল্ড নেই
// (N/K/Quota থেকে অটো-হিসাব হয়), Double/Triple-এ Target% ফিল্ড আছে।
function buildPanel(mode, title, note, hasTarget) {
  return `
    <div id="panel-${mode}" class="card ${mode === "classic" ? "" : "hidden"}">
      <h2 style="font-size:1rem;margin-top:0;">${title}</h2>
      ${note ? `<p class="t-note" style="margin-top:0;">${note}</p>` : ""}

      <div id="${mode}-setup">
        <label>শুরুর ক্যাপিটাল</label>
        <input type="number" id="${mode}-capital" placeholder="যেমনঃ 10000" />
        <label>মোট ইভেন্ট সংখ্যা (N)</label>
        <input type="number" id="${mode}-events" placeholder="যেমনঃ 20" />
        <label>কয়টা জয় দরকার (K)</label>
        <input type="number" id="${mode}-wins" placeholder="যেমনঃ 6" />
        <label>পে-আউট / কোটা (প্রতি লেগের ডেসিমেল অডস)</label>
        <input type="number" id="${mode}-payout" step="0.01" placeholder="যেমনঃ 1.85" />
        ${
          hasTarget
            ? `<label>টার্গেট প্রফিট % (ইনিশিয়াল ক্যাপিটালের উপর)</label>
               <input type="number" id="${mode}-target" step="0.1" placeholder="যেমনঃ 1" />`
            : `<p class="t-note">এই মোডে টার্গেট নিজে থেকেই হিসাব হয় (N, K, Quota থেকে) — আলাদা করে দেওয়ার দরকার নেই।</p>`
        }
        <button class="btn-primary" onclick="startSession('${mode}')">সেশন শুরু করুন</button>
      </div>

      <div id="${mode}-play" class="hidden">
        <div id="${mode}-status"></div>
        <div id="${mode}-event-controls" class="row-2">
          <button class="btn-win" onclick="recordResult('${mode}', true)">✅ জিতেছি</button>
          <button class="btn-lose" onclick="recordResult('${mode}', false)">❌ হেরেছি</button>
        </div>
        <button class="btn-secondary" onclick="resetSession('${mode}')">রিসেট / নতুন সেশন</button>
      </div>
    </div>
  `;
}

document.getElementById("panels-container").innerHTML =
  buildPanel("classic", "Classic Masaniello", "প্রতিটা ইভেন্টে একটা মাত্র সিলেকশন। টার্গেট অটো-হিসাব হয়।", false) +
  buildPanel("double", "Double Chance Masaniello", "W = দুইটা লেগ-ই জিতলে তবেই জয় ধরা হবে।", true) +
  buildPanel("triple", "Triple Chance Masaniello", "W = তিনটা লেগ-ই জিতলে তবেই জয় ধরা হবে।", true);

function showMainApp() {
  document.getElementById("lock-screen").classList.add("hidden");
  document.getElementById("key-entry").classList.add("hidden");
  document.getElementById("main-app").classList.remove("hidden");
}

function showKeyEntry(message) {
  document.getElementById("lock-screen").classList.add("hidden");
  document.getElementById("key-entry").classList.remove("hidden");
  if (message) {
    document.getElementById("key-msg").innerHTML = `<div class="error-msg">${message}</div>`;
  }
}

async function handleActivate() {
  const input = document.getElementById("key-input").value;
  const msgBox = document.getElementById("key-msg");
  msgBox.innerHTML = `<div class="subtitle">যাচাই করা হচ্ছে...</div>`;
  const res = await activateLicense(input);
  if (res.ok) {
    msgBox.innerHTML = `<div class="success-msg">✅ সফলভাবে অ্যাক্টিভেট হয়েছে!</div>`;
    setTimeout(showMainApp, 600);
  } else {
    msgBox.innerHTML = `<div class="error-msg">${res.message}</div>`;
  }
}

(async function init() {
  const check = await checkExistingActivation();
  if (check.active) {
    showMainApp();
  } else {
    showKeyEntry();
  }
})();
</script>
</body>
</html>
