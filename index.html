<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masaniello Money Management</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <link rel="stylesheet" href="style.css">
  <script src="firebase-config.js"></script>
</head>
<body>
<div class="wrap">

  <!-- লক স্ক্রিন -->
  <div id="lock-screen" class="lock-screen">
    <h1>🔒 লাইসেন্স আনলক</h1>
    <p class="subtitle">সফটওয়্যার ব্যবহার করতে আপনার লাইসেন্স কী দিন</p>
    <div class="card">
      <label for="license-input">লাইসেন্স কী</label>
      <input type="text" id="license-input" placeholder="XXXX-XXXX-XXXX">
      <button type="button" class="btn-primary" onclick="verifyLicense()">আনলক করুন</button>
      <div id="license-msg"></div>
    </div>
  </div>

  <!-- মূল অ্যাপ -->
  <div id="app-screen" class="hidden">
    <h1>Masaniello Money Management</h1>
    <p class="subtitle">আপনার ট্রেডিং এর ঝুঁকি নিয়ন্ত্রণ করুন দক্ষতার সাথে</p>

    <div class="tabs">
      <div class="tab-btn active" data-tab="masaniello">Masaniello</div>
      <div class="tab-btn" data-tab="triple">Triple Chance</div>
    </div>

    <!-- ===== Masaniello ===== -->
    <div id="masaniello-tab">
      <div class="card" id="m-setup">
        <label for="m-capital">ক্যাপিটাল</label>
        <input type="number" id="m-capital" value="1000">

        <label for="m-multiplier">টার্গেট মাল্টিপ্লায়ার (যেমন ২ মানে ক্যাপিটাল দ্বিগুণ)</label>
        <input type="number" id="m-multiplier" step="0.01" value="2">

        <label for="m-bets">মোট বেট সংখ্যা</label>
        <input type="number" id="m-bets" value="10">

        <label for="m-wins">জয়ের সংখ্যা দরকার</label>
        <input type="number" id="m-wins" value="6">

        <button type="button" class="btn-primary" onclick="masanielloStart()">সেশন শুরু করুন</button>
      </div>

      <div class="card hidden" id="m-play">
        <div id="m-status"></div>

        <label for="m-odds">এই বেটের অডস</label>
        <input type="number" id="m-odds" step="0.01">

        <button type="button" class="btn-secondary" onclick="masanielloCalcStake()">স্টেক হিসাব করুন</button>
        <div id="m-stake-result"></div>

        <div class="row-2">
          <button type="button" class="btn-win" onclick="masanielloResult(true)">✅ জিতেছি</button>
          <button type="button" class="btn-lose" onclick="masanielloResult(false)">❌ হেরেছি</button>
        </div>
        <button type="button" class="btn-secondary" onclick="masanielloReset()">নতুন সেশন</button>
      </div>
    </div>

    <!-- ===== Triple / Double Chance ===== -->
    <div id="triple-tab" class="hidden">
      <div class="card">
        <label for="t-capital">ক্যাপিটাল</label>
        <input type="number" id="t-capital" value="1000">

        <label for="t-multiplier">টার্গেট মাল্টিপ্লায়ার</label>
        <input type="number" id="t-multiplier" step="0.01" value="1.5">

        <label for="t-odds1">অডস ১</label>
        <input type="number" id="t-odds1" step="0.01" value="2.0">

        <label for="t-odds2">অডস ২</label>
        <input type="number" id="t-odds2" step="0.01" value="3.0">

        <label for="t-odds3">অডস ৩ (ঐচ্ছিক — খালি রাখলে Double Chance হিসেবে কাজ করবে)</label>
        <input type="number" id="t-odds3" step="0.01">

        <button type="button" class="btn-primary" onclick="tripleChanceCalc()">হিসাব করুন</button>
        <div id="t-result"></div>
      </div>
    </div>

    <footer>আপনার ফর্মুলা নিরাপদে সার্ভারে হিসাব করা হয় — ব্রাউজারে প্রকাশ পায় না।</footer>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
